<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi PM & PDMP - UKMKK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .swal2-title, .swal2-html-container, .swal2-confirm { font-family: 'Poppins', sans-serif !important; }
        canvas { touch-action: none; }
    </style>
</head>
<body class="flex items-start justify-center min-h-screen p-4 py-10 sm:p-6 bg-slate-50 relative overflow-x-hidden">

    <div class="absolute top-1/4 left-1/4 w-72 h-72 bg-green-400/20 rounded-full blur-[80px] -z-10"></div>
    <div class="absolute bottom-1/4 right-1/4 w-72 h-72 bg-yellow-400/20 rounded-full blur-[80px] -z-10"></div>

    <div class="bg-white/50 backdrop-blur-xl p-8 sm:p-10 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.08)] border border-white w-full max-w-md relative z-10 mt-4 mb-4">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-[#008751] to-[#76B947] bg-clip-text text-transparent">Absensi Kehadiran</h1>
            <p class="text-gray-500 mt-1 text-sm font-medium">Kegiatan PM & PDMP UKMKK</p>
            <div class="flex justify-center items-center gap-4 mt-5">
                <img src="logo-unp.png" alt="UNP Kediri" class="h-9 w-auto brightness-0 opacity-70 hover:opacity-100 transition-opacity">
                <img src="logo-ukmkk.png" alt="UKMKK" class="h-10 w-auto brightness-0 opacity-70 hover:opacity-100 transition-opacity">
                <img src="logo-yoel.png" alt="Kegiatan" class="h-9 w-auto brightness-0 opacity-70 hover:opacity-100 transition-opacity">
            </div>
        </div>
        
        <form id="form-absen" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5 ml-1">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" required placeholder="Masukkan nama lengkap..." class="w-full rounded-2xl border border-white/60 bg-white/60 px-5 py-3.5 text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-4 focus:ring-[#76B947]/30 focus:bg-white focus:border-[#76B947] transition-all shadow-sm backdrop-blur-md">
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5 ml-1">Program Studi</label>
                <select id="prodi" name="prodi" required class="w-full rounded-2xl border border-white/60 bg-white/60 px-5 py-3.5 text-gray-800 focus:outline-none focus:ring-4 focus:ring-[#76B947]/30 focus:bg-white focus:border-[#76B947] transition-all shadow-sm backdrop-blur-md appearance-none cursor-pointer bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%234B5563%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E')] bg-[length:1.25rem_1.25rem] bg-[position:right_1.25rem_center] bg-no-repeat pr-10">
                    <option value="" disabled selected>Pilih Program Studi...</option>
                    <option value="Pend. Ekonomi">Pend. Ekonomi</option>
                    <option value="Akuntansi">Akuntansi</option>
                    <option value="Manajemen">Manajemen</option>
                    <option value="Pend. Bimbingan & Konseling">Pend. Bimbingan & Konseling</option>
                    <option value="Pend. Sejarah">Pend. Sejarah</option>
                    <option value="Pend. Pancasila & Kewarganegaraan">Pend. Pancasila & Kewarganegaraan</option>
                    <option value="Pend. Bahasa & Sastra Indonesia">Pend. Bahasa & Sastra Indonesia</option>
                    <option value="Pend. Bahasa Inggris">Pend. Bahasa Inggris</option>
                    <option value="Pend. Guru Sekolah Dasar">Pend. Guru Sekolah Dasar</option>
                    <option value="Pend. Guru Pendidikan Anak Usia Dini">Pend. Guru Pendidikan Anak Usia Dini</option>
                    <option value="Kebidanan">Kebidanan</option>
                    <option value="Keperawatan">Keperawatan</option>
                    <option value="Peternakan">Peternakan</option>
                    <option value="Pend. Biologi">Pend. Biologi</option>
                    <option value="Pend. Matematika">Pend. Matematika</option>
                    <option value="Pend. Jasmani Kesehatan & Rekreasi">Pend. Jasmani Kesehatan & Rekreasi</option>
                    <option value="Sistem Informasi">Sistem Informasi</option>
                    <option value="Teknik Informatika">Teknik Informatika</option>
                    <option value="Teknik Mesin">Teknik Mesin</option>
                    <option value="Teknik Industri">Teknik Industri</option>
                    <option value="Teknik Elektronika">Teknik Elektronika</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5 ml-1">Tingkat / Semester</label>
                <select id="tingkat" name="tingkat" required class="w-full rounded-2xl border border-white/60 bg-white/60 px-5 py-3.5 text-gray-800 focus:outline-none focus:ring-4 focus:ring-[#76B947]/30 focus:bg-white focus:border-[#76B947] transition-all shadow-sm backdrop-blur-md appearance-none cursor-pointer bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%234B5563%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E')] bg-[length:1.25rem_1.25rem] bg-[position:right_1.25rem_center] bg-no-repeat pr-10">
                    <option value="" disabled selected>Pilih Tingkat...</option>
                    <option value="1">1</option>
                    <option value="3">3</option>
                    <option value="5">5</option>
                    <option value="7">7</option>
                    <option value=">8">>8</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5 ml-1">Tanda Tangan</label>
                <div class="border-2 border-dashed border-[#76B947] rounded-2xl bg-white/60 overflow-hidden relative shadow-sm backdrop-blur-md">
                    <canvas id="signature-pad" class="w-full h-40 cursor-crosshair"></canvas>
                    <button type="button" id="clear-signature" class="absolute bottom-2 right-3 bg-red-100 hover:bg-red-200 text-red-600 font-semibold text-xs px-3 py-1.5 rounded-full transition-all duration-300">Ulangi</button>
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" id="btn-submit" class="w-full bg-gradient-to-r from-[#008751] to-[#76B947] hover:from-[#00683E] hover:to-[#5C9337] text-white font-bold py-4 px-4 rounded-2xl transition-all duration-300 shadow-[0_8px_20px_-6px_rgba(0,135,81,0.5)] hover:shadow-[0_12px_25px_-6px_rgba(0,135,81,0.7)] hover:-translate-y-1 flex justify-center items-center">
                    <span>Hadir & Simpan Data</span>
                </button>
            </div>
            
            <div class="pt-4 text-center">
                <p class="text-xs text-gray-400 font-medium tracking-wide">Crafted<span class="text-[#008751] animate-pulse inline-block"></span> by <span class="font-bold text-gray-500">Sie PDD</span></p>
            </div>
        </form>
    </div>

    <script>
        // GANTI PAKAI URL DEPLOYMENT BARU PUNYAMU
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzmx_Dm2J9HXPsrORAaaLhDqrQPy-ot0SAdGrZMz32WsPOOAQ7hG4MgtIE-tUurNjWB/exec'; 
        
        const form = document.getElementById('form-absen');
        const btnSubmit = document.getElementById('btn-submit');

        const canvas = document.getElementById('signature-pad');
        function resizeCanvas() {
            const ratio =  Math.max(window.devicePixelRatio || 1, 1);
            canvas.width = canvas.offsetWidth * ratio;
            canvas.height = canvas.offsetHeight * ratio;
            canvas.getContext("2d").scale(ratio, ratio);
        }
        window.onresize = resizeCanvas;
        resizeCanvas();

        const signaturePad = new SignaturePad(canvas, { penColor: "#0f172a" });

        document.getElementById('clear-signature').addEventListener('click', () => signaturePad.clear());

        form.addEventListener('submit', e => {
            e.preventDefault();

            if (signaturePad.isEmpty()) {
                Swal.fire({ title: 'Tunggu!', text: 'Silakan tanda tangan terlebih dahulu.', icon: 'warning', confirmButtonColor: '#F36222', customClass: { popup: 'rounded-2xl' } });
                return;
            }
            
            const originalText = btnSubmit.innerHTML;
            btnSubmit.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Menyimpan...`;
            btnSubmit.disabled = true;
            btnSubmit.classList.add('opacity-90', 'cursor-not-allowed');

            const formData = new FormData();
            formData.append('nama', document.getElementById('nama').value);
            formData.append('prodi', document.getElementById('prodi').value);
            formData.append('tingkat', document.getElementById('tingkat').value);
            formData.append('ttd', signaturePad.toDataURL('image/png'));

            // Mengirim data menggunakan metode paling dasar yang didukung Google
            fetch(scriptURL, { method: 'POST', body: formData })
            .then(response => response.text()) // Ambil balasan teks mentah dari Google
            .then(text => {
                try {
                    const data = JSON.parse(text);
                    if (data.result === 'success') {
                        Swal.fire({ title: 'Mantap!', text: 'Kehadiran dan Tanda Tanganmu sudah tercatat.', icon: 'success', confirmButtonColor: '#008751', customClass: { popup: 'rounded-2xl' }});
                        form.reset();
                        signaturePad.clear(); 
                    } else {
                        // Kalau Google menolak, tampilkan pesan error dari script
                        Swal.fire({ title: 'Error Google Apps!', text: data.error, icon: 'error', confirmButtonColor: '#E82544', customClass: { popup: 'rounded-2xl' }});
                    }
                } catch(e) {
                    // Kalau Google malah nge-return halaman HTML (bukan JSON), detektor akan menampilkan teksnya
                    Swal.fire({ title: 'CORS / Server Crash!', text: 'Balasan Google: ' + text.substring(0, 100), icon: 'error', confirmButtonColor: '#E82544', customClass: { popup: 'rounded-2xl' }});
                }
            })
            .catch(error => {
                // Error kalau koneksi beneran putus (jaringan mati / URL salah total)
                Swal.fire({ title: 'Gagal Kirim Jaringan!', text: error.message, icon: 'error', confirmButtonColor: '#E82544', customClass: { popup: 'rounded-2xl' }});
            })
            .finally(() => {
                btnSubmit.innerHTML = originalText;
                btnSubmit.disabled = false;
                btnSubmit.classList.remove('opacity-90', 'cursor-not-allowed');
            });
        });
    </script>
</body>
</html>
